name: Build and Release

# A version tag builds all supported desktop platforms and collects them in one
# draft release. macOS is signed and notarized; Windows NSIS remains unsigned
# until a Windows certificate is configured. Publishing the tested draft is the
# deliberate shipping step: publish-cdn.yml copies immutable artifacts to R2
# first and replaces all platform update manifests last.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package (manual artifact only)
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows-x64
          - linux-x64
          - all

permissions:
  contents: write

jobs:
  select-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        env:
          REQUESTED_PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
        run: |
          case "$REQUESTED_PLATFORM" in
            macos)
              matrix='{"include":[{"platform":"macos","runner":"macos-latest"}]}'
              ;;
            windows-x64)
              matrix='{"include":[{"platform":"windows-x64","runner":"windows-latest"}]}'
              ;;
            linux-x64)
              matrix='{"include":[{"platform":"linux-x64","runner":"ubuntu-22.04"}]}'
              ;;
            all)
              matrix='{"include":[{"platform":"macos","runner":"macos-latest"},{"platform":"windows-x64","runner":"windows-latest"},{"platform":"linux-x64","runner":"ubuntu-22.04"}]}'
              ;;
            *)
              echo "Unsupported platform: $REQUESTED_PLATFORM" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and type checks
        run: |
          npm test
          npm run typecheck

  build:
    needs: [select-matrix, verify]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Windows command compatibility
        if: matrix.platform == 'windows-x64'
        run: |
          npm run typecheck
          npx vitest run src/main/windowsCommand.test.ts

      - name: Verify release version
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version=${RELEASE_TAG#v}
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json is $package_version but the tag is $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Verify macOS release secrets
        if: github.event_name == 'push' && matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Required release secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Install Apple signing certificate
        if: github.event_name == 'push' && matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/douchat-signing.p12"
          keychain_path="$RUNNER_TEMP/douchat-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          find "$certificate_path" -type f -delete

      - name: Build release package
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          RELEASE_BUILD: ${{ github.event_name == 'push' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          case "$TARGET_PLATFORM" in
            macos)
              if [ "$RELEASE_BUILD" = "true" ]; then npm run release:mac; else npm run package:mac; fi
              ;;
            windows-x64) npm run package:win ;;
            linux-x64) npm run package:linux ;;
            *) echo "Unsupported platform: $TARGET_PLATFORM" >&2; exit 1 ;;
          esac

      - name: Remove temporary signing keychain
        if: always() && github.event_name == 'push' && matrix.platform == 'macos'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/douchat-signing.keychain-db" || true

      - name: Verify packaged artifacts
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          release_dir="release/$version"

          require_file() {
            if [ ! -s "$1" ]; then
              echo "Required release artifact is missing or empty: $1" >&2
              exit 1
            fi
          }

          verify_manifest() {
            local manifest="$1"
            require_file "$manifest"
            grep -F "version: $version" "$manifest" >/dev/null
            while IFS= read -r referenced; do
              require_file "$release_dir/$referenced"
            done < <(sed -nE 's/^[[:space:]]*- url: (.+)$/\1/p' "$manifest")
          }

          case "$TARGET_PLATFORM" in
            macos)
              for arch in x64 arm64; do
                require_file "$release_dir/Foundry-$version-mac-$arch.dmg"
                require_file "$release_dir/Foundry-$version-mac-$arch.dmg.blockmap"
                require_file "$release_dir/Foundry-$version-mac-$arch.zip"
                require_file "$release_dir/Foundry-$version-mac-$arch.zip.blockmap"
              done
              verify_manifest "$release_dir/latest-mac.yml"
              ;;
            windows-x64)
              installer="$release_dir/Foundry-$version-win-x64.exe"
              require_file "$installer"
              require_file "$installer.blockmap"
              verify_manifest "$release_dir/latest.yml"
              7z t "$installer" >/dev/null
              ;;
            linux-x64)
              appimage="$release_dir/Foundry-$version-linux-x86_64.AppImage"
              deb="$release_dir/Foundry-$version-linux-amd64.deb"
              require_file "$appimage"
              require_file "$deb"
              verify_manifest "$release_dir/latest-linux.yml"
              dpkg-deb --info "$deb" >/dev/null
              extract_dir=$(mktemp -d)
              (
                cd "$extract_dir"
                "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
              )
              require_file "$extract_dir/squashfs-root/resources/app-update.yml"
              find "$extract_dir" -depth -delete
              ;;
          esac

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/latest*.yml
            release/*/*.blockmap

  create-draft:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create draft release and upload all platforms
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          assets=()
          while IFS= read -r -d '' artifact; do
            assets+=("$artifact")
          done < <(find dist -mindepth 2 -maxdepth 2 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o \
            -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o \
            -name 'latest*.yml' \
          \) -print0)

          for manifest in latest-mac.yml latest.yml latest-linux.yml; do
            if ! printf '%s\n' "${assets[@]}" | grep -q "/$manifest$"; then
              echo "Required update manifest is missing: $manifest" >&2
              exit 1
            fi
          done

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace assets on an already-published release" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Foundry v$version" \
              --notes "Signed and notarized macOS packages, an unsigned Windows x64 NSIS installer, and Linux x64 AppImage and Debian packages. Publish this draft only after smoke testing all platforms."
          fi

          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
